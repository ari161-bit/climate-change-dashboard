# EarthScape on Apache HTTP Server 2.4: HTTPS + load balancing across app instances.
#
# 1. Enable modules in httpd.conf:
#      mod_ssl, mod_proxy, mod_proxy_http, mod_proxy_balancer, mod_lbmethod_byrequests,
#      mod_slotmem_shm, mod_headers, mod_rewrite
# 2. Put a certificate in conf/ssl/ (self-signed for testing, e.g. made with OpenSSL).
# 3. Start the app instances:  deploy\run_instances.cmd 3
# 4. Include this file from httpd.conf and restart Apache.

<VirtualHost *:80>
    ServerName earthscape.local
    # Encryption in transit: send all plain-HTTP traffic to HTTPS
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName earthscape.local

    SSLEngine on
    SSLCertificateFile    "conf/ssl/earthscape.crt"
    SSLCertificateKeyFile "conf/ssl/earthscape.key"
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   on
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Load balancer: round-robin by request count across the app instances.
    # Health checks remove a failing instance automatically (retry after 30 s).
    <Proxy "balancer://earthscape">
        BalancerMember "http://127.0.0.1:8001" route=1 retry=30
        BalancerMember "http://127.0.0.1:8002" route=2 retry=30
        BalancerMember "http://127.0.0.1:8003" route=3 retry=30
        ProxySet lbmethod=byrequests
    </Proxy>

    # Static files are served by Apache directly (after `python manage.py collectstatic`)
    Alias /static/ "C:/amfahh/climatechanges/staticfiles/"
    <Directory "C:/amfahh/climatechanges/staticfiles">
        Require all granted
    </Directory>
    ProxyPass /static/ !

    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass        "/" "balancer://earthscape/"
    ProxyPassReverse "/" "balancer://earthscape/"

    # Balancer status page (restrict to localhost)
    <Location "/balancer-manager">
        SetHandler balancer-manager
        Require ip 127.0.0.1
    </Location>
    ProxyPass /balancer-manager !

    ErrorLog  "logs/earthscape-error.log"
    CustomLog "logs/earthscape-access.log" combined
</VirtualHost>
