{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City-wise Real Estate Data (Pie Charts)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- If the CDN is blocked/unreachable in your environment, download chart.umd.min.js,
         place it in your app's static/ folder, and swap the line above for:
         <script src="{% static 'myapp/js/chart.umd.min.js' %}"></script> -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
        }
        .chart-card {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }
        .top-bar {
            text-align: center;
            margin-bottom: 6px;
        }
        h1 {
            color: #2d3748;
            font-size: 1.4rem;
            margin: 0 0 4px 0;
        }
        .city-progress {
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .chart-wrapper {
            position: relative;
            height: 420px;
        }
        .status-msg {
            text-align: center;
            color: #718096;
            padding: 20px;
        }
        .error-msg {
            text-align: center;
            color: #e53e3e;
            padding: 20px;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
        }
        .nav-btn {
            background: #4299e1;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .nav-btn:hover:not(:disabled) {
            background: #3182ce;
        }
        .nav-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .city-dots {
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #cbd5e0;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .dot.active {
            background: #4299e1;
        }
    </style>
</head>
<body>

    <div class="chart-card">
        <div class="top-bar">
            <h1 id="chartTitle">City Real Estate Breakdown</h1>
            <div class="city-progress" id="cityProgress"></div>
        </div>
        <div id="statusMsg" class="status-msg">Loading cities...</div>
        <div class="chart-wrapper">
            <canvas id="pieChart"></canvas>
        </div>
        <div class="nav-bar">
            <button class="nav-btn" id="prevBtn">&larr; Previous</button>
            <div class="city-dots" id="cityDots"></div>
            <button class="nav-btn" id="nextBtn">Next &rarr;</button>
        </div>
    </div>

    <script>
        const CITY_LIST_URL = "http://127.0.0.1:8000/myshop/realEstateData/";
        const CITY_DETAIL_URL = "http://127.0.0.1:8000/myshop/realEstateDatabyCity/?city=";

        let cities = [];
        let currentIndex = 0;
        let chartInstance = null;
        const cache = {};

        const PALETTE = [
            'rgba(255, 99, 132, 0.7)', 'rgba(54, 162, 235, 0.7)', 'rgba(255, 206, 86, 0.7)',
            'rgba(75, 192, 192, 0.7)', 'rgba(153, 102, 255, 0.7)', 'rgba(255, 159, 64, 0.7)',
            'rgba(199, 199, 199, 0.7)', 'rgba(83, 200, 137, 0.7)', 'rgba(232, 116, 214, 0.7)',
            'rgba(120, 150, 255, 0.7)', 'rgba(255, 120, 120, 0.7)', 'rgba(120, 220, 220, 0.7)'
        ];

        function buildColors(count) {
            const colors = [];
            for (let i = 0; i < count; i++) colors.push(PALETTE[i % PALETTE.length]);
            return colors;
        }

        async function fetchCityData(city) {
            if (cache[city]) return cache[city];
            const response = await fetch(CITY_DETAIL_URL + encodeURIComponent(city));
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            cache[city] = data;
            return data;
        }

        async function renderCity(index) {
            const statusMsg = document.getElementById('statusMsg');
            const city = cities[index];

            document.getElementById('chartTitle').textContent = city + ' — Average Price by Location (Rs.)';
            document.getElementById('cityProgress').textContent = `City ${index + 1} of ${cities.length}`;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === cities.length - 1;

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            statusMsg.style.display = 'block';
            statusMsg.textContent = 'Loading ' + city + '...';
            statusMsg.classList.remove('error-msg');
            statusMsg.classList.add('status-msg');

            try {
                const data = await fetchCityData(city);

                if (!data.labels || !data.labels.length) {
                    statusMsg.textContent = 'No location data found for ' + city + '.';
                    if (chartInstance) chartInstance.destroy();
                    return;
                }

                statusMsg.style.display = 'none';

                const ds = data.dataset[0];
                const colors = buildColors(data.labels.length);

                const ctx = document.getElementById('pieChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: ds.label,
                            data: ds.data,
                            backgroundColor: colors,
                            borderColor: '#ffffff',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'right',
                                labels: {
                                    boxWidth: 12,
                                    font: { size: 10 }
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let value = context.parsed;
                                        let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        let pct = ((value / total) * 100).toFixed(1);
                                        return context.label + ': Rs. ' + value.toLocaleString('en-PK', {maximumFractionDigits: 0}) + ' (' + pct + '%)';
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                statusMsg.textContent = 'Failed to load data for ' + city + ': ' + error.message;
                statusMsg.classList.remove('status-msg');
                statusMsg.classList.add('error-msg');
                console.error('Error fetching city data:', error);
            }
        }

        function buildDots() {
            const dotsContainer = document.getElementById('cityDots');
            dotsContainer.innerHTML = '';
            cities.forEach((city, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.title = city;
                dot.addEventListener('click', () => {
                    currentIndex = i;
                    renderCity(currentIndex);
                });
                dotsContainer.appendChild(dot);
            });
        }

        async function init() {
            const statusMsg = document.getElementById('statusMsg');

            if (typeof Chart === 'undefined') {
                statusMsg.textContent = 'Chart.js failed to load from the CDN. Check your internet connection, ad-blocker, or Content-Security-Policy settings, then reload the page.';
                statusMsg.classList.remove('status-msg');
                statusMsg.classList.add('error-msg');
                return;
            }

            try {
                const response = await fetch(CITY_LIST_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                cities = data.labels;

                if (!cities || !cities.length) {
                    statusMsg.textContent = 'No cities found.';
                    return;
                }

                buildDots();
                await renderCity(currentIndex);

            } catch (error) {
                statusMsg.textContent = 'Failed to load city list: ' + error.message;
                statusMsg.classList.remove('status-msg');
                statusMsg.classList.add('error-msg');
                console.error('Error fetching city list:', error);
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCity(currentIndex);
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < cities.length - 1) {
                currentIndex++;
                renderCity(currentIndex);
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
